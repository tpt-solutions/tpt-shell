# Licence and advisory policy for tpt-shell. Enforced in CI and by the build gate (spec §4, §10.8).
#
# Policy in one line: a dependency is accepted if it is MIT, or dual-licensed with MIT.
# Apache-2.0-only crates are rejected because the allow-list below does not contain Apache-2.0.
# An "A AND B" expression requires both A and B to be allowed.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Only MIT is allowed by default. "MIT OR Apache-2.0" passes through the MIT branch.
# Any further permissive licence needs a justification line here before it is added.
allow = [
    "MIT",
    # Permissive extra (spec §4). Justification: unicode-ident, a transitive dependency of the
    # syn/quote proc-macro toolchain used by tpt-shell-macros, is licensed Unicode-3.0 in an AND
    # expression with MIT OR Apache-2.0. Its MIT branch is used.
    "Unicode-3.0",
    # Permissive extra (spec §4, todo O4 candidate list). Justification: ed25519-dalek and its
    # curve25519-dalek and subtle dependencies are BSD-3-Clause. They sign audit checkpoints
    # (M9). The BSD-3-Clause terms are permissive and are compatible with MIT OR Apache-2.0.
    "BSD-3-Clause",
    # Permissive extra (todo O-list candidate). Justification: libloading, which the Linux
    # backend uses to open GTK and WebKitGTK at run time, is ISC. ISC is a short permissive
    # licence equivalent to MIT, and its terms are compatible with MIT OR Apache-2.0.
    "ISC",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
