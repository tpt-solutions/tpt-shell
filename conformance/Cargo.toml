#
# The conformance suite (spec §14). It is its own workspace so that the root workspace does not
# need to list it: CI runs it with `cargo test --manifest-path conformance/Cargo.toml`.

[package]
name = "tpt-shell-conformance"
description = "Backend conformance suite and compatibility report for tpt-shell."
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
publish = false
rust-version = "1.90"

[workspace]

[dependencies]
tpt-shell-core = { path = "../crates/tpt-shell-core", version = "0.0.0" }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
tpt-shell-platform-windows = { path = "../crates/tpt-shell-platform-windows", version = "0.0.0" }
tpt-shell = { path = "../crates/tpt-shell", version = "0.0.0" }

[[bin]]
name = "conformance-report"
path = "src/bin/report.rs"
