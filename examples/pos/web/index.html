<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Till (virtual printer)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <section>
      <h1>Products</h1>
      <div id="products"></div>
    </section>
    <section>
      <h1>Sale</h1>
      <ul id="cart"></ul>
      <p class="total">Total <span id="total">0.00</span></p>
      <button id="print" type="button" disabled>Print receipt</button>
      <p id="status" role="status"></p>
      <h2>Receipt preview</h2>
      <pre id="preview"></pre>
    </section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
