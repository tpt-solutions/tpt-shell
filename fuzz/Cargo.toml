# Fuzz targets for tpt-shell. This package is not a workspace member: it has its own lock file
# and its own empty [workspace] table, so `cargo test` at the repository root never builds it.
#
# Deterministic smoke tests (stable Rust, no fuzzing engine):
#   cargo test --manifest-path fuzz/Cargo.toml
#
# Mutation fuzzing without a fuzzing engine (stable Rust):
#   cargo run --manifest-path fuzz/Cargo.toml --release -- <target> <seconds>
#   targets: envelope, validator, manifest, audit_chain
#
# A libFuzzer harness (cargo-fuzz) would need libfuzzer-sys, which is "(MIT OR Apache-2.0) AND
# NCSA". The NCSA term is not on the licence allow list, so it is not used here.

[package]
name = "tpt-shell-fuzz"
version = "0.0.0"
edition = "2021"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
publish = false
description = "Fuzz targets and deterministic smoke tests for tpt-shell parsers and validators."

[workspace]

[dependencies]
serde_json = "1"
tpt-shell-ipc = { path = "../crates/tpt-shell-ipc" }
tpt-shell-manifest = { path = "../crates/tpt-shell-manifest" }
tpt-shell-audit = { path = "../crates/tpt-shell-audit" }
tpt-shell-replay = { path = "../crates/tpt-shell-replay" }
