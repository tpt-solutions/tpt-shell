[package]
name = "tpt-shell"
description = "A webview app shell for Rust that is licence-clean, secure by default, and built for kiosks, regulated work and AI agents."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
tpt-shell-core = { path = "../tpt-shell-core", version = "0.0.0" }
tpt-shell-ipc = { path = "../tpt-shell-ipc", version = "0.0.0" }
tpt-shell-capabilities = { path = "../tpt-shell-capabilities", version = "0.0.0" }
tpt-shell-macros = { path = "../tpt-shell-macros", version = "0.0.0" }
tpt-shell-audit = { path = "../tpt-shell-audit", version = "0.0.0" }
tpt-shell-manifest = { path = "../tpt-shell-manifest", version = "0.0.0" }
tpt-shell-kiosk = { path = "../tpt-shell-kiosk", version = "0.0.0" }
tpt-shell-devices = { path = "../tpt-shell-devices", version = "0.0.0" }
tpt-shell-devtools = { path = "../tpt-shell-devtools", version = "0.0.0" }
tpt-shell-profiles = { path = "../tpt-shell-profiles", version = "0.0.0" }
tpt-shell-compliance = { path = "../tpt-shell-compliance", version = "0.0.0" }
tpt-shell-agent = { path = "../tpt-shell-agent", version = "0.0.0", optional = true }
serde_json = "1"

[features]
default = []
# The agent surface: MCP over stdio for the app, enabled by an enabled [agent] profile (spec 10.4).
agent = ["dep:tpt-shell-agent"]
# Local admin endpoint on 127.0.0.1, token protected. Off by default (spec 10.1).
admin-endpoint = ["tpt-shell-kiosk/admin-endpoint"]
# Local HTTP health endpoint on 127.0.0.1. Off by default (spec 10.1).
health-endpoint = ["tpt-shell-kiosk/health-endpoint"]

[target.'cfg(windows)'.dependencies]
tpt-shell-platform-windows = { path = "../tpt-shell-platform-windows", version = "0.0.0" }

[dev-dependencies]
