[package]
name = "tpt-shell-manifest"
description = "Parser and validator for tpt-shell.toml, with line-accurate errors."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["manifest", "toml", "parser", "validation", "config"]
categories = ["config"]

[dependencies]
serde = { version = "1", features = ["derive"] }
tpt-shell-core = { path = "../tpt-shell-core", version = "0.0.0" }
toml = "0.8"

[dev-dependencies]
serde_json = "1"
