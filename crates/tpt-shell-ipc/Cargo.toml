[package]
name = "tpt-shell-ipc"
description = "IPC envelope v1: parsing, limits and responses for tpt-shell."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["ipc", "json", "webview", "rpc", "validation"]
categories = ["development-tools"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tpt-shell-capabilities = { path = "../tpt-shell-capabilities", version = "0.0.0" }

[dev-dependencies]
# The fake window backend, to run a job end to end in the tests. Dev-only: the shell's
# dependency graph is unchanged.
tpt-shell-core = { path = "../tpt-shell-core", version = "0.0.0" }
