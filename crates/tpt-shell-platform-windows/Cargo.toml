[package]
name = "tpt-shell-platform-windows"
description = "Windows backend for tpt-shell: Win32 and WebView2 (own COM bindings)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
tpt-shell-ipc = { path = "../tpt-shell-ipc", version = "0.0.0" }
tpt-shell-macros = { path = "../tpt-shell-macros", version = "0.0.0" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
