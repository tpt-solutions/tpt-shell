[package]
name = "tpt-shell-macros"
description = "Procedural macros for tpt-shell: embed_dir!, and later #[command] and commands![]."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
proc-macro = true

[dependencies]
quote = "1"
proc-macro2 = "1"
syn = { version = "2", features = ["full"] }

[dev-dependencies]
serde_json = "1"
tpt-shell-ipc = { path = "../tpt-shell-ipc", version = "0.0.0" }
