[package]
name = "tpt-shell-macros"
description = "Procedural macros for tpt-shell: embed_dir!, and later #[command] and commands![]."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true
keywords = ["proc-macro", "embed", "codegen", "commands", "ipc"]
categories = ["development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
quote = "1"
proc-macro2 = "1"
syn = { version = "2", features = ["full"] }
tpt-shell-manifest = { path = "../tpt-shell-manifest", version = "0.0.0" }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tpt-shell = { path = "../tpt-shell", version = "0.0.0" }
tpt-shell-capabilities = { path = "../tpt-shell-capabilities", version = "0.0.0" }
trybuild = "1"
