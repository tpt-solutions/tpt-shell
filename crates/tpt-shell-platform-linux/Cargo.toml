[package]
name = "tpt-shell-platform-linux"
description = "Linux backend for tpt-shell: GTK and WebKitGTK loaded at run time (spec §6.3)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["gtk", "webkit", "linux", "webview", "dlopen"]
categories = ["gui", "os::unix-apis"]

[features]
# D-Bus services (StatusNotifier tray, notifications, Secret Service, AT-SPI dump, colour
# scheme). Off by default: with it off, the crate opens no socket and those calls return
# Error::Unsupported.
dbus = []

[dependencies]
libloading = "0.8"
tpt-shell-core = { path = "../tpt-shell-core", version = "0.0.0" }
