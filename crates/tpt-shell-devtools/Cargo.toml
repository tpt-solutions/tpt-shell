[package]
name = "tpt-shell-devtools"
description = "Developer overlay for tpt-shell apps (debug builds only): IPC log, jobs, capabilities, audit tail, contract explorer."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["devtools", "webview", "overlay", "debugging", "ipc"]
categories = ["development-tools::debugging"]

[dependencies]
serde_json = "1"
tpt-shell-replay = { path = "../tpt-shell-replay", version = "0.0.0" }

[features]
# The overlay page and its HTML. On by default for this crate; the facade turns it off with
# default-features = false and enables it only through its own `devtools` feature.
default = ["overlay"]
overlay = []
