[package]
name = "tpt-shell-cli"
description = "The tpt-shell command line tool: explain, manifest check, new, audit."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "tpt-shell"
path = "src/main.rs"

[dependencies]
serde_json = "1"
toml = "0.8"
tpt-shell-ipc = { path = "../tpt-shell-ipc", version = "0.0.0" }
tpt-shell-replay = { path = "../tpt-shell-replay", version = "0.0.0" }
tpt-shell-errors = { path = "../tpt-shell-errors", version = "0.0.0" }
tpt-shell-manifest = { path = "../tpt-shell-manifest", version = "0.0.0" }
tpt-shell-compliance = { path = "../tpt-shell-compliance", version = "0.0.0" }
tpt-shell-audit = { path = "../tpt-shell-audit", version = "0.0.0" }

[target.'cfg(windows)'.dependencies]
tpt-shell-platform-windows = { path = "../tpt-shell-platform-windows", version = "0.0.0" }
