[package]
name = "tpt-shell-cli"
description = "The tpt-shell command line tool: explain, manifest check, new."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "tpt-shell"
path = "src/main.rs"

[dependencies]
serde_json = "1"
tpt-shell-ipc = { path = "../tpt-shell-ipc", version = "0.0.0" }
tpt-shell-errors = { path = "../tpt-shell-errors", version = "0.0.0" }
tpt-shell-manifest = { path = "../tpt-shell-manifest", version = "0.0.0" }
tpt-shell-compliance = { path = "../tpt-shell-compliance", version = "0.0.0" }
