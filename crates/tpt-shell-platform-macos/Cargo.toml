[package]
name = "tpt-shell-platform-macos"
description = "macOS backend for tpt-shell: AppKit windows and WKWebView (spec §6.2). Compiled only on macOS."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
tpt-shell-core = { path = "../tpt-shell-core", version = "0.0.0" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-web-kit = "0.3"
block2 = "0.6"
# Keychain (Security framework). Licence: Zlib OR Apache-2.0 OR MIT, so the MIT branch applies.
objc2-security = "0.3"
objc2-core-foundation = "0.3"

# Runs on the process main thread (AppKit requires it), so the default test harness, which
# runs tests on spawned threads, cannot be used. Each check skips with a message when there is
# no GUI session.
[[test]]
name = "runtime"
harness = false
