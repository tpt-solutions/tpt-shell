[package]
name = "tpt-shell-kiosk"
description = "Kiosk support for tpt-shell: signed local config, state snapshots, idle reset (spec §10.1)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["kiosk", "signed-config", "lockdown", "ed25519", "idle-reset"]
categories = ["gui"]

[dependencies]
ed25519-dalek = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
default = []
# Local admin endpoint on 127.0.0.1, token protected. Off by default (spec 10.1).
admin-endpoint = []
# Local HTTP health endpoint on 127.0.0.1. Off by default (spec 10.1).
health-endpoint = []
