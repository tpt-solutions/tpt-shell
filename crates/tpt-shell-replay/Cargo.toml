[package]
name = "tpt-shell-replay"
description = "Record and replay format (.tptreplay): JSON Lines with assets and a versioned header, strict and lenient readers, virtualised clock and rng, a player, a time-travel timeline and redacted bug reports (spec §10.5)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["replay", "recording", "determinism", "debugging", "jsonl"]
categories = ["development-tools::debugging"]

[dependencies]
serde_json = "1"
sha2 = "0.10"
zstd = "0.14"
tpt-shell-core = { path = "../tpt-shell-core", version = "0.0.0" }
