[package]
name = "tpt-shell-devices"
description = "Device bridge: transports (serial, HID, USB), hub, virtual devices, ESC/POS and ZPL builders."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["serial", "usb", "hid", "printer", "pos"]
categories = ["hardware-support"]

[features]
# Raw TCP and UDP sockets to network devices (spec §10.2). Off by default: no socket is opened
# unless this is enabled.
net-devices = []

[dependencies]

# libc (MIT OR Apache-2.0, already in the lock file) gives the termios, ioctl and open
# declarations for the Linux and macOS transports. It is not built on Windows.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
