[package]
name = "tpt-shell-audit"
description = "Append-only, hash-chained audit log for tpt-shell (basic chain; signatures come in M9)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["audit", "hash-chain", "ed25519", "tamper-evident", "log"]
categories = ["cryptography", "development-tools"]

[dependencies]
serde_json = "1"
sha2 = "0.10"
ed25519-dalek = "2"
tpt-shell-manifest = { path = "../tpt-shell-manifest", version = "0.0.0" }
