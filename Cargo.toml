    "crates/tpt-shell-agent",
    "crates/tpt-shell-audit",
    "crates/tpt-shell-capabilities",
    "crates/tpt-shell-cli",
    "crates/tpt-shell-compliance",
    "crates/tpt-shell-core",
    "crates/tpt-shell-devices",
    "crates/tpt-shell-errors",
    "crates/tpt-shell-ipc",
    "crates/tpt-shell-macros",
