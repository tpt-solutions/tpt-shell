[workspace]
resolver = "2"
# Templates and examples are standalone projects that depend on the crates by path.
exclude = [
    "templates/agent-demo",
    "templates/appfront-dom",
    "templates/audit-app",
    "templates/kiosk",
    "templates/pos",
    "examples/agent-demo",
    "examples/audit-viewer",
    "examples/devices-sim",
    "examples/kiosk",
    "examples/pos",
]
members = [
    "crates/tpt-shell",
    "crates/tpt-shell-agent",
    "crates/tpt-shell-audit",
    "crates/tpt-shell-capabilities",
    "crates/tpt-shell-cli",
    "crates/tpt-shell-compliance",
    "crates/tpt-shell-core",
    "crates/tpt-shell-devices",
    "crates/tpt-shell-devtools",
    "crates/tpt-shell-errors",
    "crates/tpt-shell-ipc",
    "crates/tpt-shell-kiosk",
    "crates/tpt-shell-macros",
    "crates/tpt-shell-manifest",
    "crates/tpt-shell-platform-linux",
    "crates/tpt-shell-platform-macos",
    "crates/tpt-shell-platform-windows",
    "crates/tpt-shell-profiles",
    "crates/tpt-shell-replay",
    "crates/tpt-shell-supervisor",
    "crates/tpt-shell-test",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
publish = false
