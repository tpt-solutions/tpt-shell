#
# CI (spec §15). Every job that can run in this repository is here. Jobs that need a backend,
# a template or a fuzz target that does not exist yet say so and pass with a skip message, so the
# gap is visible in the log rather than hidden. The runner labels for aarch64 are set by GitHub.

name: ci

on:
  push:
  pull_request:
  # Nightly: the long fuzz run only. The per-commit fuzz smoke run is deterministic (see below).
  schedule:
    - cron: "17 3 * * *"

# Read-only token. Nothing in CI publishes (publishing is a later milestone).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Version of the Microsoft.Web.WebView2 NuGet package whose WebView2Loader.dll is the pinned
  # loader (THIRD_PARTY_NOTICES, decision O1). Change it together with that file.
  WEBVIEW2_NUGET_VERSION: 1.0.4312-prerelease

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path conformance/Cargo.toml -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            conformance
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --manifest-path conformance/Cargo.toml --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Linux tests run under Xvfb, so a test that opens a window does not need a desktop.
      - name: Install Xvfb (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth
      - name: Test (Linux, headless display)
        if: runner.os == 'Linux'
        run: bash tools/headless-linux.sh xvfb cargo test --workspace
      - name: Test
        if: runner.os != 'Linux'
        run: cargo test --workspace

  # aarch64 runners (spec §15, "where runners exist"). The labels are set by GitHub:
  # ubuntu-24.04-arm and windows-11-arm are arm64 Linux and Windows runners, and macos-14 is an
  # arm64 macOS label (macos-latest is arm64 as well). Which plans include these runners, and what
  # they cost, is set by GitHub: check the current runner documentation before enabling them. The
  # jobs run only when the repository variable ENABLE_ARM_RUNNERS is "true", so they do not queue
  # until that is set.
  test-aarch64:
    if: vars.ENABLE_ARM_RUNNERS == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-14, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Xvfb (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth
      - name: Test (Linux, headless display)
        if: runner.os == 'Linux'
        run: bash tools/headless-linux.sh xvfb cargo test --workspace
      - name: Test
        if: runner.os != 'Linux'
        run: cargo test --workspace

  # The conformance suite (spec §14) on each OS. Only a check that passes is green; pending and
  # skipped checks are listed in the result file and in the compatibility report.
  conformance:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: conformance
      - name: Fetch the pinned WebView2 loader (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pkg = Join-Path $env:RUNNER_TEMP "webview2.zip"
          $url = "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/$env:WEBVIEW2_NUGET_VERSION"
          Invoke-WebRequest -Uri $url -OutFile $pkg
          $dir = Join-Path $env:RUNNER_TEMP "webview2"
          Expand-Archive -Path $pkg -DestinationPath $dir -Force
          $dll = Get-ChildItem -Path $dir -Recurse -Filter WebView2Loader.dll |
            Where-Object { $_.FullName -match "x64" } | Select-Object -First 1
          if (-not $dll) { throw "WebView2Loader.dll (x64) is not in the package" }
          "TPT_WEBVIEW2_LOADER=$($dll.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install Xvfb (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth
      - name: Conformance (Linux, headless display)
        if: runner.os == 'Linux'
        run: bash tools/headless-linux.sh xvfb cargo test --manifest-path conformance/Cargo.toml --test conformance -- --nocapture
      - name: Conformance
        if: runner.os != 'Linux'
        run: cargo test --manifest-path conformance/Cargo.toml --test conformance -- --nocapture
      - name: Upload the result file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-${{ matrix.os }}
          path: conformance/out/
          if-no-files-found: warn

  # Partial: a headless Weston compositor. Failures are shown but do not fail the workflow, until
  # the GTK backend (M5) makes this job meaningful. See tools/headless-linux.sh.
  conformance-wayland:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: conformance
      - name: Install Weston
        run: sudo apt-get update && sudo apt-get install -y weston
      - name: Conformance (headless Wayland, partial)
        env:
          TPT_CONFORMANCE_LABEL: linux-wayland
        run: bash tools/headless-linux.sh wayland cargo test --manifest-path conformance/Cargo.toml --test conformance -- --nocapture
      - name: Upload the result file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-linux-wayland
          path: conformance/out/
          if-no-files-found: warn

  # Merges the three result files into the compatibility report (spec §14, "generates the public
  # compatibility report"). The report is also written to the job summary.
  compat-report:
    needs: conformance
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: conformance
      - uses: actions/download-artifact@v4
        with:
          pattern: conformance-*
          path: conformance/in
          merge-multiple: true
      - name: Build the report
        run: cargo run --manifest-path conformance/Cargo.toml --bin conformance-report -- conformance/in conformance/report
      - name: Publish the report in the job summary
        run: cat conformance/report/compatibility.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: compatibility-report
          path: conformance/report/

  # Spec §10.6: the visual comparison merges the artifacts of the three OS jobs. Screenshots come
  # with the test driver (M8). Until then the bundle holds the result files only.
  visual-artifacts:
    needs: conformance
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: conformance-*
          path: visual
          merge-multiple: true
      - uses: actions/upload-artifact@v4
        with:
          name: visual-artifacts
          path: visual/
          if-no-files-found: warn

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
      # Deterministic: a fixed seed and a fixed number of inputs per target, so a failure on one
      # commit reproduces on the next. Skips with a message until fuzz/ exists.
      - run: bash tools/fuzz-smoke.sh 2000

  # Nightly only: the same targets for much longer. Every target stops after 300 seconds (see
  # tools/fuzz-smoke.sh). Runs only on the schedule trigger.
  fuzz-nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
      - run: bash tools/fuzz-smoke.sh 100000000

  docs-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook
      - name: Build the book
        run: mdbook build docs
      - name: Check that the book loads nothing from the network
        run: bash tools/check-docs-offline.sh docs/book
      - name: Compile the docs code samples
        run: python3 -I tools/doc-samples.py
      - name: Support tags (from the public API)
        run: python3 -I tools/support-tags.py --render >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: docs-book
          path: docs/book/
          if-no-files-found: warn

  template-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bash tools/template-build.sh

  # Benchmarks (spec §13, BENCHMARKS.md). Runs what can be measured today: the hello-world binary
  # size. The rest of the budgets are listed as pending in the results file.
  benchmarks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bash tools/run-benchmarks.sh
      - uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: target/bench/
          if-no-files-found: error

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  spdx-headers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every Rust, TOML, shell, Python and YAML source has an SPDX header
        run: |
          missing=0
          while IFS= read -r f; do
            if ! head -n 5 "$f" | grep -q "SPDX-License-Identifier: MIT OR Apache-2.0"; then
              echo "missing SPDX header: $f"
              missing=1
            fi
          done < <(find crates conformance tools \( -name '*.rs' -o -name 'Cargo.toml' -o -name '*.sh' -o -name '*.py' -o -name '*.yml' \) -not -path '*/target/*' | sort)
          exit $missing

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            conformance
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth
      - name: Check the workspace
        run: cargo check --workspace --locked
      - name: Test the workspace on the MSRV
        run: bash tools/headless-linux.sh xvfb cargo test --workspace --locked
      - name: Check the conformance suite
        run: cargo check --manifest-path conformance/Cargo.toml --locked --all-targets

  runtime-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/check-runtime-size.sh
