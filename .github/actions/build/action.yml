#
# Builds the workspace with the lock file pinned (--locked). Callers run it once per platform in
# a matrix; the platform is whatever runner the job uses.
name: Build
description: Build the tpt-shell workspace with the lock file pinned.
inputs:
  profile:
    description: debug or release.
    required: false
    default: debug
  toolchain:
    description: Toolchain for setup-rust.
    required: false
    default: stable
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-rust
      with:
        toolchain: ${{ inputs.toolchain }}
    - name: Build workspace
      shell: bash
      run: |
        if [ "${{ inputs.profile }}" = "release" ]; then
          cargo build --workspace --locked --release
        else
          cargo build --workspace --locked
        fi
